[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-cli"
version = "1.0.0"
description = "A pure Unix terminal MP3 & FLAC music player for macOS with live audio spectrum visualization and cover art."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Pulse CLI Contributors"}
]
keywords = ["music-player", "cli", "tui", "mp3", "flac", "cover-art", "terminal", "macos", "coreaudio", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "miniaudio>=1.59",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
]

[project.scripts]
pulse = "pulse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]
