[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-cli"
version = "1.0.0"
description = "A sleek, keyboard-driven terminal MP3 player for macOS with live audio spectrum visualization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pulse CLI Contributors"}
]
keywords = ["music-player", "cli", "tui", "mp3", "terminal", "macos", "coreaudio", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.70.0",
    "miniaudio>=1.59",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
]

[project.scripts]
pulse = "pulse.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulse*"]
