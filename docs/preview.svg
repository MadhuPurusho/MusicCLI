    <text x="0" y="52" class="t-bold">┌─[ 1: FILES ]──────────────────────────────┐</text>
    <text x="0" y="70" class="t-dim">│  [DIR] ..                                 │</text>
    <text x="0" y="88" class="t-norm">│  [DIR] Electronic/                        │</text>
    <text x="0" y="106" class="t-norm">│  [DIR] Synthwave/                         │</text>

