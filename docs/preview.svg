      <text x="0" y="70" class="t-bold">│ ■ 01. Terminal Odyssey - Retro Synth01:19 │</text>
      <text x="0" y="88" class="t-norm">│   02. Neon Grid - CyberPulse        03:50 │</text>
      <text x="0" y="106" class="t-norm">│   03. Midnight Drift - SynthWave    04:45 │</text>
      <text x="0" y="124" class="t-norm">│   04. Orbital Echoes - Solaris      05:12 │</text>
      <text x="0" y="142" class="t-dim">│                                           │</text>
      <text x="0" y="160" class="t-dim">│                                           │</text>
      <text x="0" y="178" class="t-dim">│                                           │</text>
