      <text x="0" y="68" class="t-bold">│   ██ ▀▀ ██ ██ ██ ██ ▀▀ ██ ▀▀ ██ ▀▀ ██ ██ ▀▀ ██ ██ ▀▀ ██ ▀▀ ██ ▀▀ ██ ▀▀ ██ ██ ▀▀ ██ ▀▀ ██ ██ ▀▀  │</text>
      <text x="0" y="86" class="t-bold">│   ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██ ██   │</text>
      <text x="0" y="102" class="t-bold">└───────────────────────────────────────────────────────────────────────────────────────────────┘</text>
    </g>

    <!-- Now Playing & Album Cover Box -->
