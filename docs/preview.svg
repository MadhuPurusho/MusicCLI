      <text x="14" y="15" class="inv-tx">[SPACE] PLAY/PAUSE   [ENTER] SELECT   [A] ADD   [TAB] PANE   [V] COVER   [←/→] SEEK   [+/-] VOL   [Q] QUIT</text>
