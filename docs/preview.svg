    <text x="390" y="124" class="t-bold">│</text>

    <text x="0" y="142" class="t-norm">│  [FLAC] 02. Neon Grid.flac                │</text>
    <text x="0" y="160" class="t-norm">│  [MP3]  03. Midnight Drift.mp3            │</text>
    <text x="0" y="178" class="t-norm">│  [MP3]  04. Orbital Echoes.mp3            │</text>
