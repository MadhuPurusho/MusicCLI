      <text x="0" y="30" class="t-norm">│ <tspan class="t-bold"> ▄  ▄███▄▄   </tspan> │ <tspan class="t-bold">[PLAY] Retro Synth - Terminal Odyssey</tspan>                 <tspan class="t-bold">[FLAC 588k / STEREO]</tspan> │</text>
      <text x="0" y="48" class="t-norm">│ <tspan class="t-bold">▄  ██▀  ███  </tspan> │ ALBUM: Neon Grid 1984 (1984)  GENRE: Synthwave                                  │</text>
      <text x="0" y="66" class="t-norm">│ <tspan class="t-bold"> ▀  ▀▀█▀▀▀   </tspan> │ 00:15 [████████████████▓░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░░] 01:19 (-01:04) 18.9% │</text>
      <text x="0" y="84" class="t-norm">│ <tspan class="t-bold"> ▀ ▄ ▄  ▄  ▄ </tspan> │ VOL:[███████░░░] 70%  │  LOOP:OFF  │  SHUF:OFF  │  TRK:01/04  │  <tspan class="t-bold">[V] COVER</tspan>       │</text>
